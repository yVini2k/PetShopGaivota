spring.application.name=PetShopGaivotaAPI

# Cria O Banco - mem = memória
spring.datasource.url=jdbc:h2:mem:petshop
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate atualiza as tabelas do baanco pelo java
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# vizualização do banco
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mostrar comandos SQL no console
spring.jpa.show-sql=true


